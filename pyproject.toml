[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "searchagent-rl"
version = "0.1.0"
description = "Reinforcement Learning for Multi-turn Search Agents"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
data = ["datasets>=2.18"]
hf = ["torch>=2.4", "transformers>=4.45"]
rl = ["hydra-core>=1.3", "ray>=2.30"]
plot = ["matplotlib>=3.8", "pandas>=2.0", "seaborn>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
