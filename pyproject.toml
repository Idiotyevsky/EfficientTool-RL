[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "efficienttool-rl"
version = "0.1.0"
description = "Cost-aware multi-turn tool-agent training with GRPO"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
data = ["datasets>=2.18"]
hf = ["torch>=2.4", "transformers>=4.45"]
rl = ["hydra-core>=1.3", "ray>=2.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
