tools:
  - class_name: "efficienttool_rl.verl.search_tool.HotpotSearchTool"
    config:
      type: native
      top_k: 3
      max_top_k: 3
      max_executed_search_calls: 3
      max_observation_tokens: 512
    tool_schema:
      type: function
      function:
        name: search
        description: Search a deterministic local passage collection for evidence.
        parameters:
          type: object
          properties:
            query:
              type: string
              description: A concise evidence-focused search query.
            top_k:
              type: integer
              description: Optional result count; the environment applies its configured cap.
              minimum: 1
              maximum: 3
          required:
            - query
