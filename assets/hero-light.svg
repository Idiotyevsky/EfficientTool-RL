<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">MiniAgentRL agentic reinforcement learning architecture</title>
  <desc id="desc">A Qwen agent turns a question into a tool call, receives a search observation, answers, and sends a reward to GRPO for a policy update.</desc>
  <defs>
    <marker id="arrow-primary" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5B5CE2"/></marker>
    <marker id="arrow-tool" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0D8CA8"/></marker>
    <marker id="arrow-positive" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#16845B"/></marker>
    <style>
      .title { font: 700 20px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .08em; }
      .label { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { font: 600 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .04em; }
      .muted { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>
  <rect x="8" y="8" width="1184" height="524" rx="28" fill="#F8F9FC" stroke="#DFE3F0" stroke-width="2"/>
  <text x="52" y="53" class="title" fill="#5B5CE2">MINIAGENTRL / SYSTEM MAP</text>
  <text x="1148" y="53" text-anchor="end" class="small" fill="#657087">INTERACTION / POLICY UPDATE</text>
  <rect x="40" y="78" width="1120" height="236" rx="20" fill="#FFFFFF" stroke="#DFE3F0"/>
  <text x="64" y="109" class="small" fill="#657087">AGENT LOOP</text>
  <rect x="66" y="148" width="156" height="68" rx="14" fill="#F5F5FF" stroke="#C9CAFA" stroke-width="2"/><text x="144" y="188" text-anchor="middle" class="label" fill="#232749">Question</text>
  <rect x="264" y="148" width="176" height="68" rx="14" fill="#EEF0FF" stroke="#9C9DF2" stroke-width="2"/><text x="352" y="179" text-anchor="middle" class="label" fill="#3436A2">Qwen Agent</text><text x="352" y="199" text-anchor="middle" class="muted" fill="#657087">policy</text>
  <rect x="482" y="148" width="154" height="68" rx="14" fill="#ECFAFC" stroke="#8CD5DE" stroke-width="2"/><text x="559" y="179" text-anchor="middle" class="label" fill="#076A7C">Tool Call</text><text x="559" y="199" text-anchor="middle" class="muted" fill="#657087">action</text>
  <rect x="678" y="148" width="210" height="68" rx="14" fill="#ECFAFC" stroke="#8CD5DE" stroke-width="2"/><text x="783" y="179" text-anchor="middle" class="label" fill="#076A7C">Search Environment</text><text x="783" y="199" text-anchor="middle" class="muted" fill="#657087">deterministic BM25</text>
  <rect x="930" y="148" width="178" height="68" rx="14" fill="#F3F5F8" stroke="#C9D0DC" stroke-width="2"/><text x="1019" y="179" text-anchor="middle" class="label" fill="#343B4B">Observation</text><text x="1019" y="199" text-anchor="middle" class="muted" fill="#657087">new evidence</text>
  <path d="M222 182H256M440 182H474" stroke="#5B5CE2" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <path d="M636 182H670M888 182H922" stroke="#0D8CA8" stroke-width="3" marker-end="url(#arrow-tool)"/>
  <path d="M1019 148C1019 112 352 112 352 148" fill="none" stroke="#0D8CA8" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow-tool)"/>
  <text x="685" y="127" text-anchor="middle" class="small" fill="#0D8CA8">observation becomes the next state</text>
  <path d="M352 216C352 244 559 244 559 250" fill="none" stroke="#5B5CE2" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
  <rect x="482" y="250" width="154" height="48" rx="13" fill="#F5F5FF" stroke="#C9CAFA" stroke-width="2"/><text x="559" y="280" text-anchor="middle" class="label" fill="#3436A2">Final Answer</text>
  <rect x="40" y="338" width="1120" height="156" rx="20" fill="#FFFFFF" stroke="#DFE3F0"/><text x="64" y="369" class="small" fill="#657087">TRAINING LOOP</text>
  <rect x="480" y="392" width="158" height="58" rx="14" fill="#F5F5FF" stroke="#C9CAFA" stroke-width="2"/><text x="559" y="427" text-anchor="middle" class="label" fill="#3436A2">Final Answer</text><path d="M559 298V384" stroke="#5B5CE2" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
  <rect x="695" y="392" width="148" height="58" rx="14" fill="#F0FBF5" stroke="#9DD9B7" stroke-width="2"/><text x="769" y="427" text-anchor="middle" class="label" fill="#126B45">Reward</text><path d="M638 421H687" stroke="#16845B" stroke-width="3" marker-end="url(#arrow-positive)"/>
  <rect x="900" y="392" width="122" height="58" rx="14" fill="#F5F5FF" stroke="#9C9DF2" stroke-width="2"/><text x="961" y="427" text-anchor="middle" class="label" fill="#3436A2">GRPO</text><path d="M843 421H892" stroke="#5B5CE2" stroke-width="3" marker-end="url(#arrow-primary)"/>
  <rect x="1060" y="392" width="76" height="58" rx="14" fill="#EEF0FF" stroke="#9C9DF2" stroke-width="2"/><text x="1098" y="418" text-anchor="middle" class="small" fill="#3436A2">Updated</text><text x="1098" y="437" text-anchor="middle" class="small" fill="#3436A2">Policy</text><path d="M1022 421H1052" stroke="#5B5CE2" stroke-width="3" marker-end="url(#arrow-primary)"/>
</svg>
