<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">GRPO grouped rollout mental model</title>
  <desc id="desc">Four trajectories for one prompt are compared by reward, converted to group-relative advantages, and used for a policy update.</desc>
  <defs>
    <marker id="grpo-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8D8FF4"/></marker>
    <style>
      .eyebrow { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; }
      .label { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .body { font: 500 14px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .06em; }
    </style>
  </defs>
  <rect x="8" y="8" width="1184" height="384" rx="26" fill="#151826" stroke="#2C3348" stroke-width="2"/>
  <text x="44" y="49" class="eyebrow" fill="#A6A8FF">GRPO / GROUP-RELATIVE SIGNAL</text><text x="1155" y="49" text-anchor="end" class="small" fill="#9CA7BD">CONCEPTUAL VIEW · NOT A BENCHMARK RESULT</text>
  <rect x="42" y="78" width="574" height="258" rx="18" fill="#181C2A" stroke="#2C3348"/><text x="70" y="112" class="small" fill="#9CA7BD">ONE PROMPT · FOUR ROLLOUTS</text>
  <rect x="70" y="130" width="518" height="40" rx="11" fill="#17352A" stroke="#54C58B"/><text x="90" y="156" class="label" fill="#EEF0FF">Rollout A</text><text x="315" y="156" class="body" fill="#8CE0B2">reward high</text><text x="540" y="156" text-anchor="end" class="label" fill="#8CE0B2">advantage +</text>
  <rect x="70" y="181" width="518" height="40" rx="11" fill="#20243B" stroke="#696BEA"/><text x="90" y="207" class="label" fill="#EEF0FF">Rollout B</text><text x="315" y="207" class="body" fill="#BFC1FF">reward medium</text><text x="540" y="207" text-anchor="end" class="label" fill="#BFC1FF">advantage +</text>
  <rect x="70" y="232" width="518" height="40" rx="11" fill="#2A202B" stroke="#A15B69"/><text x="90" y="258" class="label" fill="#EEF0FF">Rollout C</text><text x="315" y="258" class="body" fill="#F2A6B0">reward low</text><text x="540" y="258" text-anchor="end" class="label" fill="#F2A6B0">advantage −</text>
  <rect x="70" y="283" width="518" height="40" rx="11" fill="#2A202B" stroke="#A15B69"/><text x="90" y="309" class="label" fill="#EEF0FF">Rollout D</text><text x="315" y="309" class="body" fill="#F2A6B0">reward low</text><text x="540" y="309" text-anchor="end" class="label" fill="#F2A6B0">advantage −</text>
  <path d="M638 207H755" stroke="#8D8FF4" stroke-width="4" marker-end="url(#grpo-arrow)"/><text x="697" y="184" text-anchor="middle" class="small" fill="#A6A8FF">COMPARE</text><text x="697" y="246" text-anchor="middle" class="small" fill="#9CA7BD">NORMALIZE</text>
  <rect x="790" y="105" width="350" height="205" rx="18" fill="#20243B" stroke="#696BEA" stroke-width="2"/><text x="820" y="143" class="eyebrow" fill="#A6A8FF">GRPO UPDATE</text><text x="820" y="181" class="label" fill="#EEF0FF">Group-relative signal</text><text x="820" y="211" class="body" fill="#C7CCDD">positive advantage</text><text x="1055" y="211" text-anchor="end" class="label" fill="#8CE0B2">↑ probability</text><text x="820" y="239" class="body" fill="#C7CCDD">negative advantage</text><text x="1055" y="239" text-anchor="end" class="label" fill="#F2A6B0">↓ probability</text><path d="M820 263H1108" stroke="#3A4260"/><text x="820" y="289" class="body" fill="#9CA7BD">policy: πθ  ←  trajectories + rewards</text>
  <text x="600" y="365" text-anchor="middle" class="small" fill="#657087">Same prompt, multiple trajectories: reinforce what is better than the group.</text>
</svg>
