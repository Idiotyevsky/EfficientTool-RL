<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MiniAgentRL learning roadmap</title>
  <desc id="desc">Nine lessons move from environment setup and tool calling through real Qwen, multi-turn interaction, rollouts, GRPO, and efficient tool use.</desc>
  <defs>
    <marker id="road-arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8D8FF4"/></marker>
    <style>
      .eyebrow { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; }
      .num { font: 700 14px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .08em; }
      .name { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .meta { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .04em; }
    </style>
  </defs>
  <rect x="8" y="8" width="1184" height="414" rx="26" fill="#151826" stroke="#2C3348" stroke-width="2"/>
  <text x="44" y="49" class="eyebrow" fill="#A6A8FF">LEARN TRACK / 00 → 08</text>
  <text x="1155" y="49" text-anchor="end" class="meta" fill="#9CA7BD">CONCEPT → RUN → RESEARCH</text>
  <path d="M250 128H278M470 128H498M690 128H718M910 128H938" stroke="#8D8FF4" stroke-width="3" marker-end="url(#road-arrow)"/>
  <path d="M1040 173V254" stroke="#8D8FF4" stroke-width="3" marker-end="url(#road-arrow)"/>
  <path d="M814 300H802M594 300H582M374 300H362" stroke="#8D8FF4" stroke-width="3" marker-end="url(#road-arrow)"/>
  <g><rect x="44" y="88" width="206" height="82" rx="16" fill="#20243B" stroke="#696BEA" stroke-width="2"/><text x="64" y="116" class="num" fill="#A6A8FF">00 / START</text><text x="64" y="143" class="name" fill="#EEF0FF">Environment map</text><text x="64" y="161" class="meta" fill="#9CA7BD">CPU · CONCEPT</text></g>
  <g><rect x="264" y="88" width="206" height="82" rx="16" fill="#12343D" stroke="#42C4D1" stroke-width="2"/><text x="284" y="116" class="num" fill="#8BE0E7">01 / BUILD</text><text x="284" y="143" class="name" fill="#EEF0FF">Tool Calling</text><text x="284" y="161" class="meta" fill="#9CA7BD">CPU · RUN</text></g>
  <g><rect x="484" y="88" width="206" height="82" rx="16" fill="#20243B" stroke="#696BEA" stroke-width="2"/><text x="504" y="116" class="num" fill="#A6A8FF">02 / MODEL</text><text x="504" y="143" class="name" fill="#EEF0FF">Real Qwen</text><text x="504" y="161" class="meta" fill="#9CA7BD">GPU · RUN</text></g>
  <g><rect x="704" y="88" width="206" height="82" rx="16" fill="#12343D" stroke="#42C4D1" stroke-width="2"/><text x="724" y="116" class="num" fill="#8BE0E7">03 / INTERACT</text><text x="724" y="143" class="name" fill="#EEF0FF">Multi-turn</text><text x="724" y="161" class="meta" fill="#9CA7BD">CPU · RUN</text></g>
  <g><rect x="924" y="88" width="206" height="82" rx="16" fill="#20243B" stroke="#696BEA" stroke-width="2"/><text x="944" y="116" class="num" fill="#A6A8FF">04 / BASELINE</text><text x="944" y="143" class="name" fill="#EEF0FF">ReAct + Hotpot</text><text x="944" y="161" class="meta" fill="#9CA7BD">GPU · RUN</text></g>
  <g><rect x="814" y="260" width="206" height="82" rx="16" fill="#20243B" stroke="#696BEA" stroke-width="2"/><text x="834" y="288" class="num" fill="#A6A8FF">05 / INSPECT</text><text x="834" y="315" class="name" fill="#EEF0FF">Rollout &amp; Reward</text><text x="834" y="333" class="meta" fill="#9CA7BD">CPU · CONCEPT</text></g>
  <g><rect x="594" y="260" width="206" height="82" rx="16" fill="#20243B" stroke="#696BEA" stroke-width="2"/><text x="614" y="288" class="num" fill="#A6A8FF">06 / TRAIN</text><text x="614" y="315" class="name" fill="#EEF0FF">GRPO</text><text x="614" y="333" class="meta" fill="#9CA7BD">GPU · CONCEPT</text></g>
  <g><rect x="374" y="260" width="206" height="82" rx="16" fill="#17352A" stroke="#54C58B" stroke-width="2"/><text x="394" y="288" class="num" fill="#8CE0B2">07 / UPDATE</text><text x="394" y="315" class="name" fill="#EEF0FF">Real Update</text><text x="394" y="333" class="meta" fill="#9CA7BD">GPU · RUN</text></g>
  <g><rect x="154" y="260" width="206" height="82" rx="16" fill="#12343D" stroke="#42C4D1" stroke-width="2"/><text x="174" y="288" class="num" fill="#8BE0E7">08 / OPTIMIZE</text><text x="174" y="315" class="name" fill="#EEF0FF">Efficient Tools</text><text x="174" y="333" class="meta" fill="#9CA7BD">CPU · CONCEPT</text></g>
  <text x="600" y="389" text-anchor="middle" class="meta" fill="#657087">Start small. Inspect every trajectory. Then scale the research run.</text>
</svg>
